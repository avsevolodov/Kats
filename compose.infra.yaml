name: kats-test
services:
  mssql:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-CU18-ubuntu-22.04}
    platform: linux/amd64
    env_file:
      - path: .local/test-infra/mssql.env
        format: raw
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports: ["127.0.0.1:14333:1433"]
    volumes:
      - mssql-data:/var/opt/mssql
      - ./.local/test-infra/bootstrap:/bootstrap:ro
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-C", "-b", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  temporal:
    image: ${TEMPORAL_IMAGE:-temporalio/temporal:1.4.1}
    entrypoint: ["temporal"]
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db", "--ui-port", "8233"]
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
    volumes: ["temporal-data:/home/temporal"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.1.4}
    command: ["start-dev", "--import-realm"]
    env_file:
      - path: .local/test-infra/keycloak.env
        format: raw
    environment:
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8180:8080"]
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./.local/test-infra/realm:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3; read -r status <&3; [[ "$$status" == *" 200 "* ]]'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mssql-data:
  temporal-data:
  keycloak-data:
