[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-runner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "grpcio==1.74.0",
  "protobuf==6.31.1",
  "httpx==0.28.1",
  "deepagents==0.7.12",
  "langchain>=1.3.18,<2.0.0",
  "langchain-core>=1.6.1,<2.0.0",
  "langchain-openai>=0.3.0,<1.0",
  "langgraph>=1.2.5,<1.3.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "grpcio-tools==1.74.0"]

[project.scripts]
agent-runner = "opencode_runner.main:main"
chat-agent = "chat_agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["opencode_runner*", "chat_agent*"]
